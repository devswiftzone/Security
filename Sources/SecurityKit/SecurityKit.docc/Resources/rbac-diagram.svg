<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="SF Pro,Helvetica Neue,Arial,sans-serif">
  <rect width="800" height="500" fill="#f5f5f7"/>
  <text x="400" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#1d1d1f">RBAC Relationship Diagram</text>
  <rect x="50" y="100" width="180" height="60" rx="8" fill="#0071e3"/>
  <text x="140" y="135" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">Users</text>
  <rect x="310" y="100" width="180" height="60" rx="8" fill="#34c759"/>
  <text x="400" y="135" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">Roles</text>
  <rect x="570" y="100" width="180" height="60" rx="8" fill="#ff9500"/>
  <text x="660" y="135" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">Permissions</text>
  <rect x="310" y="300" width="400" height="100" rx="8" fill="#f5f5f7" stroke="#c7c7cc" stroke-width="2"/>
  <text x="510" y="335" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d1d1f">AuthorizationPolicy</text>
  <text x="510" y="360" text-anchor="middle" font-size="12" fill="#86868b">Custom evaluation logic</text>
  <line x1="230" y1="130" x2="310" y2="130" stroke="#86868b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="270" y="120" text-anchor="middle" font-size="11" fill="#86868b">M:N</text>
  <line x1="490" y1="130" x2="570" y2="130" stroke="#86868b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="530" y="120" text-anchor="middle" font-size="11" fill="#86868b">M:N</text>
  <line x1="510" y1="360" x2="510" y2="300" stroke="#86868b" stroke-width="2" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#86868b"/></marker></defs>
</svg>